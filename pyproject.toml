[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alpacavision"
version = "3.1.0"
description = "Near-duplicate leakage audit and licence-audited alpaca detection benchmark"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Dina Maribel Yana-Yucra" },
    { name = "Richar Andre Vilca-Solorzano" },
    { name = "Leonid Aleman-Gonzales" },
    { name = "Cristian Daniel Ccopa-Acero" },
    { name = "Vladimiro Ibañez-Quispe" },
]
keywords = ["computer-vision", "object-detection", "data-leakage", "near-duplicate-detection", "alpaca", "yolo"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "ultralytics==8.4.63",
    "numpy==2.4.4",
    "pillow==12.2.0",
    "opencv-python==5.0.0.93",
    "pyyaml==6.0.3",
    "python-dotenv==1.2.2",
]

[project.optional-dependencies]
research = [
    "timm==1.0.30",
    "imagehash==4.3.2",
    "open_clip_torch==2.29.0",
    "scipy==1.17.1",
    "scikit-learn==1.9.1",
    "pandas==3.1.0",
    "matplotlib==3.11.2",
    "requests==2.34.2",
    "tqdm==4.70.1",
    "onnx==1.23.2",
    "onnxruntime==1.31.0",
    "roboflow==1.3.8",
    "pyinaturalist==0.21.1",
]
demo = [
    "flask>=3.0",
    "gunicorn>=21.2",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
