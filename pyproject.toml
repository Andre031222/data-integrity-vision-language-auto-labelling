[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "alpacavision"
version = "3.1.0"
description = "Near-duplicate leakage audit and licence-audited alpaca detection benchmark"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Dina Maribel Yana-Yucra" },
    { name = "Richar Andre Vilca-Solorzano" },
    { name = "Leonid Aleman-Gonzales" },
    { name = "Cristian Daniel Ccopa-Acero" },
    { name = "Vladimiro Ibañez-Quispe" },
]
keywords = ["computer-vision", "object-detection", "data-leakage", "near-duplicate-detection", "alpaca", "yolo"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
