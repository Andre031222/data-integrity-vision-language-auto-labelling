# Nginx site for paqocha.ginit.dev — reverse proxy to Gunicorn on 127.0.0.1:9060.
# 1) Copy to /etc/nginx/sites-available/paqocha.ginit.dev and symlink into sites-enabled.
# 2) Point the DNS A record paqocha.ginit.dev -> your server IP.
# 3) Obtain TLS:  sudo certbot --nginx -d paqocha.ginit.dev
server {
    listen 80;
    server_name paqocha.ginit.dev;

    client_max_body_size 16m;   # match Flask MAX_CONTENT_LENGTH

    location / {
        proxy_pass         http://127.0.0.1:9060;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;    # cold-start model load on first request
    }
}
