# AlpacaVision class schema
# Actualizado: 2025

# --- Detector classes (YOLOv11) -------------------
detector_classes:
  0: alpaca               # Cuerpo completo
  1: alpaca_head          # Cabeza (incluye cuello superior)
  2: alpaca_eye           # eye region
  3: alpaca_leg_front     # Extremidad delantera (desde rodilla)
  4: alpaca_leg_rear      # Extremidad trasera (desde rodilla)
  5: alpaca_body          # Cuerpo sin cabeza ni extremidades

# --- Clasificador -- Ojos ------------------------------------------------------
eye_classifier_classes:
  0: eye_normal           # no visible ocular anomaly
  1: eye_cataract         # Opacidad del cristalino (catarata)
  2: eye_opacity          # Opacidad corneal / nubosidad
  3: eye_discharge        # abnormal discharge or epiphora
  4: eye_inflammation     # evident inflammation or redness

# --- Clasificador -- Extremidades ----------------------------------------------
leg_classifier_classes:
  0: leg_normal           # no limb anomaly
  1: leg_angular          # Deformidad angular (valgus / varus)
  2: leg_hoof_abnormal    # abnormal hoof growth or lesion
  3: leg_swelling         # evident joint swelling
  4: leg_posture_abnormal # Postura anormal al apoyar

# --- Notas --------------------------------------------------------------------
# - Keep the bounding box as tight to the region as possible.
# - Ambiguous cases: annotate as the most conservative class and log in docs/.
# - At least two reviewers per ambiguous image.
# - eye_* and leg_* labels are assigned after cropping with the detector.
